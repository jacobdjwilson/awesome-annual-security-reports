name: Sync Main to Development

on:
  push:
    branches:
      - main



env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  sync-branch:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Merge main into development
        run: python .github/scripts/sync-branch.py --source origin/main --target development