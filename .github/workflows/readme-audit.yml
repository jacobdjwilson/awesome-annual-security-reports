name: README Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * 0' # Every Sunday at 14:00 UTC

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  issues: write

jobs:
  audit-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run README Audit
        id: audit
        run: python .github/scripts/readme-audit.py
          
      - name: Upload Findings
        uses: actions/upload-artifact@v4
        with:
          name: readme-audit-findings
          path: .github/artifacts/readme_audit_findings.json
          
      - name: Generate Step Summary
        if: always()
        run: python .github/scripts/generate-readme-audit-summary.py
