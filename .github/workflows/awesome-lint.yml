name: Awesome Lint

on:
  push:
    paths:
      - 'README.md'
  pull_request:
    paths:
      - 'README.md'
  workflow_dispatch:

permissions: read-all

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install awesome-lint
        run: npm install --global awesome-lint

      - name: Run awesome-lint
        id: lint_check
        run: |
          awesome-lint > lint_output.txt || true
          cat lint_output.txt

          python .github/scripts/parse-awesome-lint.py

      - name: Check for lint ignore directives
        run: |
          if grep -q "lint ignore" README.md; then
            echo "ℹ️ README.md contains lint ignore directives — this is expected for some entries."
          fi

      - name: Determine workflow status
        id: status_check
        run: |
          if grep -q "✖" lint_output.txt; then
            echo "lint_status=failed" >> $GITHUB_OUTPUT
            ERROR_COUNT=$(grep -c "✖" lint_output.txt || echo "0")
            echo "error_count=$ERROR_COUNT" >> $GITHUB_OUTPUT
            echo "::error::Linting failed with $ERROR_COUNT error(s). See annotations above."
            exit 1
          else
            echo "lint_status=succeeded" >> $GITHUB_OUTPUT
            echo "error_count=0" >> $GITHUB_OUTPUT
            echo "✅ Linting succeeded!"
          fi

      - name: Generate step summary
        if: always()
        env:
          RUN_URL: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          STATUS: "${{ steps.status_check.outputs.lint_status }}"
          ERROR_COUNT: "${{ steps.status_check.outputs.error_count }}"
          REF_NAME: "${{ github.ref_name }}"
          EVENT_NAME: "${{ github.event_name }}"
        run: |
          python .github/scripts/generate-workflow-summary.py --workflow lint