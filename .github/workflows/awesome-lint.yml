name: Awesome Lint

on:
  push:
    paths:
      - 'README.md'
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - 'README.md'
  workflow_dispatch:

permissions: read-all

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare lint target
        env:
          GITHUB_EVENT_NAME: "${{ github.event_name }}"
          PR_HEAD_SHA: "${{ github.event.pull_request.head.sha }}"
        run: python .github/scripts/prepare-lint-target.py

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install awesome-lint
        run: npm install --global awesome-lint

      - name: Run awesome-lint
        run: awesome-lint > lint_output.txt 2>&1 || true

      - name: Validate lint results
        id: status_check
        run: python .github/scripts/parse-awesome-lint.py

      - name: Generate step summary
        if: always()
        env:
          RUN_URL: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          STATUS: "${{ steps.status_check.outputs.lint_status }}"
          ERROR_COUNT: "${{ steps.status_check.outputs.error_count }}"
          REF_NAME: "${{ github.ref_name }}"
          EVENT_NAME: "${{ github.event_name }}"
        run: python .github/scripts/generate-workflow-summary.py --workflow lint