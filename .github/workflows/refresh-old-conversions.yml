name: Refresh Old Conversions

on:
  schedule:
    - cron: '0 13 * * *'  # 8:00 AM ET daily

  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of files to refresh (default: 10)'
        required: false
        default: '10'
        type: string

      days_old:
        description: 'Minimum age in days (default: 90)'
        required: false
        default: '90'
        type: string

concurrency:
  group: security-reports-processing
  cancel-in-progress: false


env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  identify-stale-files:
    runs-on: ubuntu-latest
    outputs:
      has_files: ${{ steps.check-files.outputs.has_files }}
      file_count: ${{ steps.check-files.outputs.file_count }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Load workflow configuration
        id: load_config
        run: python .github/scripts/load-pipeline-config.py

      - name: Check existing refresh PR and PR cap
        id: check-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_OPEN_PRS: ${{ steps.load_config.outputs.max_open_prs }}
          WORKFLOW_TYPE: refresh
        run: python .github/scripts/check-pr-cap.py

      - name: Collect PDFs already covered by open PR branches
        id: pending-prs
        if: steps.check-pr.outputs.pr_exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/collect-pending-prs.py

      - name: Find stale files
        id: check-files
        if: steps.check-pr.outputs.pr_exists != 'true'
        env:
          LIMIT: ${{ github.event.inputs.limit || steps.load_config.outputs.default_limit }}
          DAYS_OLD: ${{ github.event.inputs.days_old || '90' }}
        run: python .github/scripts/check-stale-conversions.py

      - name: Upload file list
        if: |
          steps.check-pr.outputs.pr_exists != 'true' &&
          steps.check-files.outputs.has_files == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: files-to-process
          path: files_to_process.txt
          retention-days: 1

      - name: Generate discovery summary
        if: always()
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          INPUT_LIMIT: ${{ github.event.inputs.limit }}
          INPUT_DAYS_OLD: ${{ github.event.inputs.days_old }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          PR_EXISTS: ${{ steps.check-pr.outputs.pr_exists }}
          SKIP_REASON: ${{ steps.check-pr.outputs.skip_reason }}
          OPEN_COUNT: ${{ steps.check-pr.outputs.open_count }}
          HAS_FILES: ${{ steps.check-files.outputs.has_files }}
          COUNT: ${{ steps.check-files.outputs.file_count }}
        run: python .github/scripts/generate-workflow-summary.py --workflow refresh --step discovery

  process-stale-reports:
    permissions:
      contents: write
      pull-requests: write
    needs: identify-stale-files
    if: needs.identify-stale-files.outputs.has_files == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Load configuration and install dependencies
        run: python .github/scripts/install-task-dependencies.py --task conversion --system

      - name: Download file list
        uses: actions/download-artifact@v7
        with:
          name: files-to-process

      - name: Cache AI Analysis
        uses: actions/cache@v4
        with:
          path: .analysis_cache.json
          key: ai-analysis-cache-${{ github.ref }}-${{ github.run_id }}
          restore-keys: |
            ai-analysis-cache-${{ github.ref }}-
            ai-analysis-cache-

      - name: Run PDF converter
        id: converter
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SEARCH_API_KEY: ${{ secrets.GOOGLE_SEARCH_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
        run: |
          python .github/scripts/pdf-converter.py \
            --file-list files_to_process.txt \
            --output-json conversions.json \
            --artifacts-dir .github/artifacts \
            --smart-reconvert

      - name: Run report analyzer
        id: analyzer
        if: success()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python .github/scripts/report-analyzer.py \
            conversions.json \
            --output-json analysis.json \
            --artifacts-dir .github/artifacts

      - name: Update README
        id: readme_update
        if: success()
        run: |
          python .github/scripts/generate-refresh-pr.py \
            --analysis-file analysis.json \
            --file-count "${{ needs.identify-stale-files.outputs.file_count }}" \
            --days-old "${{ github.event.inputs.days_old || '90' }}"

      - name: Create PR
        id: create_pr
        if: steps.readme_update.outputs.changes_detected == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "${{ steps.readme_update.outputs.commit_message }}"
          title: "${{ steps.readme_update.outputs.pr_title }}"
          body-path: refresh_pr_body.md
          branch: ${{ steps.readme_update.outputs.branch_name }}
          delete-branch: true
          add-paths: |
            README.md
            Markdown Conversions/
          labels: |
            automated
            maintenance

      - name: Upload conversion results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: refresh-conversion-results
          path: |
            conversions.json
            analysis.json
            analysis_errors.json
            readme-update-results.json
          if-no-files-found: ignore

      - name: Generate processing summary
        if: always()
        env:
          INPUT_DAYS_OLD: ${{ github.event.inputs.days_old }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          SUCCESSFUL: ${{ steps.converter.outputs.successful_count }}
          FAILED: ${{ steps.converter.outputs.failed_count }}
          PR_NUM: ${{ steps.create_pr.outputs.pull-request-number }}
          FILE_COUNT: ${{ needs.identify-stale-files.outputs.file_count }}
          CHANGES_DETECTED: ${{ steps.readme_update.outputs.changes_detected }}
          ANALYSIS_COUNT: ${{ steps.analyzer.outputs.analysis_count }}
          ANALYSIS_ERROR_COUNT: ${{ steps.analyzer.outputs.error_count }}
          ERRORS_FILE: ${{ steps.analyzer.outputs.errors_file }}
        run: python .github/scripts/generate-workflow-summary.py --workflow refresh --step processing