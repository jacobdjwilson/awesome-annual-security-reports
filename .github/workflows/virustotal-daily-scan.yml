name: VirusTotal Daily Background Scan

on:
  schedule:
    - cron: '0 0 * * *' # Every day at midnight UTC
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scan Mode'
        required: true
        default: 'daily_scan'
        type: choice
        options:
          - daily_scan
          - audit_unseen
      batch_limit:
        description: 'Batch limit for audit mode (Free tier daily quota is 500)'
        required: false
        default: '450'
        type: string

permissions:
  contents: read

jobs:
  daily-scan:
    permissions:
      contents: write
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python .github/scripts/install-task-dependencies.py --task virustotal

      - name: Cache VirusTotal Tracking
        uses: actions/cache@v4
        with:
          path: .github/artifacts/vt-scanned.json
          key: vt-scanned-${{ github.run_id }}
          restore-keys: |
            vt-scanned-

      - name: Find all PDFs
        run: python .github/scripts/find-files.py --all

      - name: Run Scan
        id: vt-scan
        env:
          VIRUS_TOTAL_API_KEY: ${{ secrets.VIRUS_TOTAL_API_KEY }}
          VT_MODE: ${{ inputs.mode || 'daily_scan' }}
          VT_BATCH_LIMIT: ${{ inputs.batch_limit || '450' }}
        run: |
          python .github/scripts/virus-total-scan.py \
            files_to_process.txt \
            --artifacts-dir .github/artifacts

      - name: Upload Unseen PDFs Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unseen-pdfs-to-submit
          path: |
            unseen_pdfs_to_submit.txt
            unseen_pdfs_to_submit.json
          if-no-files-found: ignore

      - name: Open Issue on Malicious Finding
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python .github/scripts/notify-malicious-finding.py
