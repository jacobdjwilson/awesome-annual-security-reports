name: VirusTotal Daily Background Scan

on:
  schedule:
    - cron: '0 0 * * *' # Every day at midnight UTC
  workflow_dispatch: # Allow manual trigger



permissions:
  contents: read

jobs:
  daily-scan:
    permissions:
      contents: write
      issues: write
      actions: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python .github/scripts/install-task-dependencies.py --task virustotal

      - name: Cache VirusTotal Tracking
        uses: actions/cache@v4
        with:
          path: .github/artifacts/vt-scanned.json
          key: vt-scanned-${{ github.run_id }}
          restore-keys: |
            vt-scanned-

      - name: Find all PDFs
        run: python .github/scripts/find-files.py --all

      - name: Run Daily Scan
        id: vt-scan
        env:
          VIRUS_TOTAL_API_KEY: ${{ secrets.VIRUS_TOTAL_API_KEY }}
        run: |
          python .github/scripts/virus-total-scan.py \
            files_to_process.txt \
            --daily-mode \
            --artifacts-dir .github/artifacts

      - name: Upload Unseen Reports Artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unseen-pdfs-to-submit
          path: |
            unseen_pdfs_to_submit.txt
            unseen_pdfs_to_submit.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload VirusTotal Tracking Cache Artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: vt-tracking-cache
          path: .github/artifacts/vt-scanned.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Open Issue on Malicious Finding
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python .github/scripts/notify-malicious-finding.py
