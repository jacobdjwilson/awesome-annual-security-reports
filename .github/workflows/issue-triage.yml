name: Issue Triage

on:
  issues:
    types: [edited]



env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  triage:
    permissions:
      issues: write
      contents: write
    runs-on: ubuntu-latest

    # Only run on edits by humans on automated discovery issues.
    # Discovery issues carry both 'automated' and 'report-suggestion' labels.
    if: |
      github.actor != 'github-actions[bot]' &&
      contains(github.event.issue.labels.*.name, 'automated') &&
      contains(github.event.issue.labels.*.name, 'report-suggestion')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Parse triage checkbox
        id: parse
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_AUTHOR: ${{ github.actor }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: python .github/scripts/parse-triage-checkbox.py

      - name: Apply triage label
        if: steps.parse.outputs.valid == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LABEL: ${{ steps.parse.outputs.label }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python .github/scripts/apply-triage-label.py

      - name: Post triage acknowledgement and close
        if: steps.parse.outputs.valid == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          OUTCOME: ${{ steps.parse.outputs.outcome }}
          AUTHOR: ${{ steps.parse.outputs.author }}
          CLOSE: ${{ steps.parse.outputs.close }}
        run: python .github/scripts/post-triage-acknowledgement.py

      - name: Record feedback event in artifact
        if: steps.parse.outputs.valid == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OUTCOME: ${{ steps.parse.outputs.outcome }}
          REASON: ${{ steps.parse.outputs.reason }}
          AUTHOR: ${{ steps.parse.outputs.author }}
          ISSUE: ${{ steps.parse.outputs.issue }}
          ISSUE_TITLE: ${{ steps.parse.outputs.title }}
        run: python .github/scripts/record-feedback-event.py

      - name: Commit updated artifact
        if: steps.parse.outputs.valid == 'true'
        run: python .github/scripts/commit-feedback-artifact.py --issue "${{ steps.parse.outputs.issue }}"
