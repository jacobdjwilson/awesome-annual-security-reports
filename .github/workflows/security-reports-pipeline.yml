name: Security Reports Processing Pipeline

permissions:
  contents: read
  actions: read
  packages: read

on:
  push:
    branches: [main, development]
    paths:
      - 'Annual Security Reports/**/*.pdf'
  pull_request:
    branches: [main, development]
    paths:
      - 'Annual Security Reports/**/*.pdf'
  schedule:
    - cron: '0 12 * * *'  # 7:00 AM ET daily
  workflow_dispatch:
    inputs:
      quota_retry_attempt:
        description: 'Internal: retry attempt number after quota exhaustion (1, 2, 3)'
        required: false
        default: '1'
        type: string
      year_filter:
        description: 'Process PDFs from specific year'
        required: false
        type: string
      category_filter:
        description: 'Process PDFs from specific category'
        required: false
        type: choice
        options:
          - ''
          - '2020'
          - '2021'
          - '2022'
          - '2023'
          - '2024'
          - '2025'
          - '2026'
      organization_filter:
        description: 'Process PDFs matching organization'
        required: false
        type: string
      limit_count:
        description: 'Limit files to process'
        required: false
        type: string
      skip_virus_scan:
        description: 'Skip VirusTotal scanning'
        required: false
        default: false
        type: boolean
      skip_existing_conversions:
        description: 'Skip files with existing conversions'
        required: false
        default: true
        type: boolean

concurrency:
  group: security-reports-processing
  cancel-in-progress: false



env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  discover-and-scan:
    runs-on: ubuntu-latest
    outputs:
      has_files: ${{ steps.find-files.outputs.has_files }}
      scan_mode: ${{ steps.find-files.outputs.scan_mode }}
      file_count: ${{ steps.find-files.outputs.file_count }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Load workflow configuration
        id: load_config
        run: python .github/scripts/load-pipeline-config.py

      - name: Check automated PR cap
        id: pr-cap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_OPEN_PRS: ${{ steps.load_config.outputs.max_open_prs }}
          WORKFLOW_TYPE: general
        run: python .github/scripts/check-pr-cap.py

      - name: Collect PDFs already covered by open PR branches
        id: pending-prs
        if: steps.pr-cap.outputs.cap_reached != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/collect-pending-prs.py

      - name: Find and validate PDF files
        id: find-files
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          CAP_REACHED: ${{ steps.pr-cap.outputs.cap_reached }}
          LIMIT_COUNT: ${{ github.event.inputs.limit_count }}
          YEAR_FILTER: ${{ github.event.inputs.year_filter }}
          CATEGORY_FILTER: ${{ github.event.inputs.category_filter }}
          ORG_FILTER: ${{ github.event.inputs.organization_filter }}
          SKIP_EXISTING: ${{ github.event.inputs.skip_existing_conversions }}
        run: python .github/scripts/find-files.py

      - name: Upload file lists
        if: steps.find-files.outputs.has_files == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: file-lists
          path: |
            files_to_process.txt
            invalid_files.txt

      - name: Generate discovery summary
        if: always()
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SCAN_MODE: ${{ steps.find-files.outputs.scan_mode }}
          FILE_COUNT: ${{ steps.find-files.outputs.file_count }}
          PUSH_MODE: ${{ steps.load_config.outputs.push_mode }}
          PUSH_BATCH_LIMIT: ${{ steps.load_config.outputs.push_batch_limit }}
          CAP_REACHED: ${{ steps.pr-cap.outputs.cap_reached }}
          OPEN_COUNT: ${{ steps.pr-cap.outputs.open_count }}
          MAX_OPEN_PRS: ${{ steps.load_config.outputs.max_open_prs }}
          PENDING_COUNT: ${{ steps.pending-prs.outputs.pending_count }}
        run: python .github/scripts/generate-pipeline-summary.py --step discovery

  virus-total-scan:
    runs-on: ubuntu-latest
    needs: discover-and-scan
    if: needs.discover-and-scan.outputs.has_files == 'true'
    outputs:
      scan_passed: ${{ steps.vt-scan.outputs.scan_passed }}
      scan_skipped: ${{ steps.vt-scan.outputs.scan_skipped }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download file list
        uses: actions/download-artifact@v7
        with:
          name: file-lists

      - name: Install dependencies
        run: python .github/scripts/install-task-dependencies.py --task virustotal

      - name: Run VirusTotal scan
        id: vt-scan
        env:
          VIRUS_TOTAL_API_KEY: ${{ secrets.VIRUS_TOTAL_API_KEY }}
          SKIP_VIRUS_SCAN: ${{ github.event.inputs.skip_virus_scan }}
        run: python .github/scripts/virus-total-scan.py files_to_process.txt --scan-mode "${{ needs.discover-and-scan.outputs.scan_mode }}"

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: scan-results
          path: scan_results.json

      - name: Generate VirusTotal summary
        if: always()
        env:
          SCAN_MODE: ${{ needs.discover-and-scan.outputs.scan_mode }}
          VT_SKIPPED: ${{ steps.vt-scan.outputs.scan_skipped }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python .github/scripts/generate-pipeline-summary.py --step virustotal

  convert-pdf-to-markdown:
    runs-on: ubuntu-latest
    needs: [discover-and-scan, virus-total-scan]
    if: |
      needs.discover-and-scan.outputs.has_files == 'true' &&
      needs.virus-total-scan.outputs.scan_passed == 'true'
    outputs:
      successful_count: ${{ steps.converter.outputs.successful_count }}
      failed_count: ${{ steps.converter.outputs.failed_count }}
      quota_exhausted: ${{ steps.converter.outputs.quota_exhausted }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download file list
        uses: actions/download-artifact@v7
        with:
          name: file-lists

      - name: Load configuration and install dependencies
        run: python .github/scripts/install-task-dependencies.py --task conversion --system

      - name: Run PDF converter
        id: converter
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python .github/scripts/pdf-converter.py --file-list files_to_process.txt --exit-zero-on-quota

      - name: Upload conversions
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: conversion-results
          path: conversions.json
          if-no-files-found: ignore

      - name: Upload markdown files
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: markdown-conversions
          path: "Markdown Conversions/"
          if-no-files-found: ignore

      - name: Generate conversion summary
        if: always()
        env:
          SUCCESSFUL: ${{ steps.converter.outputs.successful_count }}
          FAILED: ${{ steps.converter.outputs.failed_count }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python .github/scripts/generate-pipeline-summary.py --step conversion

  analyze-reports:
    runs-on: ubuntu-latest
    needs: [discover-and-scan, convert-pdf-to-markdown]
    if: needs.discover-and-scan.outputs.has_files == 'true'
    outputs:
      analysis_success: ${{ steps.report-analysis.outputs.analysis_success }}
      analysis_count: ${{ steps.report-analysis.outputs.analysis_count }}
      error_count: ${{ steps.report-analysis.outputs.error_count }}
      quota_exhausted: ${{ steps.report-analysis.outputs.quota_exhausted }}
      errors_file: ${{ steps.report-analysis.outputs.errors_file }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download conversions
        uses: actions/download-artifact@v7
        with:
          name: conversion-results

      - name: Download markdown files
        uses: actions/download-artifact@v7
        with:
          name: markdown-conversions
          path: "Markdown Conversions/"

      - name: Pre-analysis verification
        id: verify
        run: python .github/scripts/verify-conversions-json.py

      - name: Install dependencies
        if: steps.verify.outputs.has_successful == 'true'
        run: python .github/scripts/install-task-dependencies.py --task analysis

      - name: Cache AI Analysis
        uses: actions/cache@v4
        with:
          path: .analysis_cache.json
          key: ai-analysis-cache-${{ github.ref }}-${{ github.run_id }}
          restore-keys: |
            ai-analysis-cache-${{ github.ref }}-
            ai-analysis-cache-

      - name: Run report analyzer
        id: report-analysis
        if: steps.verify.outputs.has_successful == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python .github/scripts/report-analyzer.py conversions.json --exit-zero-on-quota

      - name: Upload analysis artifacts
        if: steps.verify.outputs.has_successful == 'true' && always()
        uses: actions/upload-artifact@v6
        with:
          name: analysis-results
          path: |
            analysis.json
            ${{ steps.report-analysis.outputs.errors_file }}
          if-no-files-found: ignore

      - name: Generate analysis summary
        if: always()
        env:
          COUNT: ${{ steps.report-analysis.outputs.analysis_count }}
          ERROR_COUNT: ${{ steps.report-analysis.outputs.error_count }}
          ERRORS_FILE: ${{ steps.report-analysis.outputs.errors_file }}
          HAS_SUCCESSFUL: ${{ steps.verify.outputs.has_successful }}
          ANALYSIS_SUCCESS: ${{ steps.report-analysis.outputs.analysis_success }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python .github/scripts/generate-pipeline-summary.py --step analysis

  update-readme:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    needs: [discover-and-scan, virus-total-scan, convert-pdf-to-markdown, analyze-reports]
    if: |
      needs.discover-and-scan.outputs.has_files == 'true' &&
      needs.virus-total-scan.outputs.scan_passed == 'true' &&
      needs.analyze-reports.outputs.analysis_success == 'true'
    outputs:
      readme_updated: ${{ steps.readme_update.outputs.readme_updated }}
      pr_number: ${{ steps.create_pr.outputs.pull-request-number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download analysis
        uses: actions/download-artifact@v7
        with:
          name: analysis-results

      - name: Download scan results
        uses: actions/download-artifact@v7
        with:
          name: scan-results

      - name: Download markdown files
        uses: actions/download-artifact@v7
        with:
          name: markdown-conversions
          path: "Markdown Conversions/"

      - name: Install dependencies
        run: python .github/scripts/install-task-dependencies.py --task google_search

      - name: Update README
        id: readme_update
        env:
          GOOGLE_SEARCH_API_KEY: ${{ secrets.GOOGLE_SEARCH_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
        run: python .github/scripts/readme-updater.py analysis.json

      - name: Generate PR content
        id: generate_pr
        if: steps.readme_update.outputs.readme_updated == 'true'
        run: >-
          python .github/scripts/generate-pr-content.py
          --scan-mode "${{ needs.discover-and-scan.outputs.scan_mode }}"
          --conv-ok "${{ needs.convert-pdf-to-markdown.outputs.successful_count }}"
          --conv-fail "${{ needs.convert-pdf-to-markdown.outputs.failed_count }}"
          --vt-skipped "${{ needs.virus-total-scan.outputs.scan_skipped }}"

      - name: Create Pull Request
        id: create_pr
        if: steps.readme_update.outputs.readme_updated == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "${{ steps.generate_pr.outputs.pr_title }}"
          title: "${{ steps.generate_pr.outputs.pr_title }}"
          body-path: pr_body.md
          branch: ${{ steps.generate_pr.outputs.branch_name }}
          delete-branch: true
          labels: ${{ steps.generate_pr.outputs.labels }}
          add-paths: |
            README.md
            Markdown Conversions/

      - name: Upload README update log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: readme-update-log
          path: skip_log.json
          if-no-files-found: ignore

      - name: Generate README update summary
        if: always()
        env:
          README_UPDATED: ${{ steps.readme_update.outputs.readme_updated }}
          PR_NUM: ${{ steps.create_pr.outputs.pull-request-number }}
          SCAN_MODE: ${{ needs.discover-and-scan.outputs.scan_mode }}
          VT_SKIPPED: ${{ needs.virus-total-scan.outputs.scan_skipped }}
          CONV_OK: ${{ needs.convert-pdf-to-markdown.outputs.successful_count }}
          CONV_FAIL: ${{ needs.convert-pdf-to-markdown.outputs.failed_count }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python .github/scripts/generate-pipeline-summary.py --step readme

  # ============================================================
  # QUOTA RETRY JOB
  # When conversion or analysis signals quota exhaustion, this job
  # waits and re-dispatches the pipeline as a new workflow run.
  # ============================================================
  retry-on-quota:
    runs-on: ubuntu-latest
    needs: [discover-and-scan, convert-pdf-to-markdown, analyze-reports]
    if: |
      always() &&
      needs.discover-and-scan.outputs.has_files == 'true' &&
      (
        needs.convert-pdf-to-markdown.outputs.quota_exhausted == 'true' ||
        needs.analyze-reports.outputs.quota_exhausted == 'true'
      )
    permissions:
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Schedule retry dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RETRY_ATTEMPT: ${{ github.event.inputs.quota_retry_attempt }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python .github/scripts/dispatch-quota-retry.py
