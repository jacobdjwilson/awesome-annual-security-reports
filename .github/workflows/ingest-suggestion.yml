name: Auto-Ingest Report Suggestion

on:
  issues:
    types: [opened, labeled]

concurrency:
  group: security-reports-processing
  cancel-in-progress: false



env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  ingest:
    permissions:
      contents: write
      pull-requests: write
      issues: write   # write needed to post comments
    # Run when the report-suggestion label is applied, OR when the issue is
    # opened and already carries the label (e.g. from the issue template).
    if: |
      (
        github.event.label.name == 'report-suggestion' ||
        contains(github.event.issue.labels.*.name, 'report-suggestion')
      ) && (
        !contains(github.event.issue.labels.*.name, 'automated') ||
        contains(github.event.issue.labels.*.name, 'accepted') ||
        github.event.label.name == 'accepted'
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Parse issue form fields directly from the issue body using the GitHub
      # API via gh CLI. This avoids the fragile stefanbuck/github-issue-parser
      # action which silently returns empty outputs when it cannot match the
      # issue body against the template (e.g. on 'labeled' events, encoding
      # differences, or action version changes).
      #
      # GitHub issue forms render each field as:
      #   ### <Field Label>
      #   (blank line)
      #   <value>
      # We extract values by finding the heading and taking the next non-blank line.
      - name: Parse issue content
        id: parse
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python .github/scripts/parse-issue-form.py

      - name: Validate parsed fields
        id: validate
        env:
          URL: ${{ steps.parse.outputs.report_url }}
          YEAR: ${{ steps.parse.outputs.report_year }}
          ORG: ${{ steps.parse.outputs.organization_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/validate-ingest-fields.py

      - name: Download and organize PDF
        id: download
        env:
          URL: ${{ steps.parse.outputs.report_url }}
          YEAR: ${{ steps.parse.outputs.report_year }}
          ORG: ${{ steps.parse.outputs.organization_name }}
          TITLE: ${{ steps.parse.outputs.report_title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/download-report-pdf.py

      - name: Configure git for large file pushes
        run: python .github/scripts/configure-git-buffers.py

      - name: Create ingestion PR
        id: create_pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "📥 Ingest: ${{ steps.parse.outputs.organization_name }} — ${{ steps.parse.outputs.report_title }} (${{ steps.parse.outputs.report_year }})"
          title: "📥 Ingest: ${{ steps.parse.outputs.organization_name }} ${{ steps.parse.outputs.report_title }} (${{ steps.parse.outputs.report_year }})"
          body: |
            ## 📥 Report Ingestion

            Ingesting report suggested in Issue #${{ github.event.issue.number }}.

            | Field | Value |
            |-------|-------|
            | **Organization** | ${{ steps.parse.outputs.organization_name }} |
            | **Title** | ${{ steps.parse.outputs.report_title }} |
            | **Year** | ${{ steps.parse.outputs.report_year }} |
            | **Category** | ${{ steps.parse.outputs.report_category }} |
            | **File** | `${{ steps.download.outputs.file_name }}` |
            | **File Size** | ${{ steps.download.outputs.file_size }} bytes |
            | **Source URL** | ${{ steps.parse.outputs.report_url }} |

            Merging this PR will trigger the **Security Reports Processing Pipeline** to convert the PDF to Markdown, analyze it, and add it to the README automatically.

            ---
            *Auto-generated from [Issue #${{ github.event.issue.number }}](https://github.com/${{ github.repository }}/issues/${{ github.event.issue.number }})*
          branch: "ingest/issue-${{ github.event.issue.number }}"
          delete-branch: true
          add-paths: |
            Annual Security Reports/
          labels: |
            report-suggestion
            automated

      - name: Comment on issue with PR link
        if: steps.create_pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ steps.create_pr.outputs.pull-request-number }}
          FILE_NAME: ${{ steps.download.outputs.file_name }}
        run: python .github/scripts/post-ingest-comment.py

      - name: Generate step summary
        if: always()
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          PR_NUM: ${{ steps.create_pr.outputs.pull-request-number }}
          ORG_NAME: ${{ steps.parse.outputs.organization_name }}
          REPORT_TITLE: ${{ steps.parse.outputs.report_title }}
          REPORT_YEAR: ${{ steps.parse.outputs.report_year }}
          REPORT_CATEGORY: ${{ steps.parse.outputs.report_category }}
          FILE_NAME: ${{ steps.download.outputs.file_name }}
          VALID: ${{ steps.validate.outputs.valid }}
          DOWNLOAD_CONCLUSION: ${{ steps.download.conclusion }}
        run: |
          python .github/scripts/generate-workflow-summary.py --workflow ingest
